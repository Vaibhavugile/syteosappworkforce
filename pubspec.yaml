name: syteos_business
description: "Syteos Labs LLP - Internal Business Management App"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8

  # Navigation / State
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2

  # UI / Fonts
  google_fonts: ^8.2.1

  # Date / Time
  intl: ^0.20.3

  # Images
  image_picker: ^1.2.3
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # Local temporary files
  path_provider: ^2.1.5

  # Device / Location
  geolocator: ^14.1.1
  geocoding: ^5.0.0

  # Utilities
  uuid: ^4.6.0
  http: ^1.6.0
  mime: ^2.0.0
  file_picker: 13.1.0
  video_player: ^2.10.0

  # Maps
  google_maps_flutter: ^2.13.1

  # External links
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Launcher Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # App Icon
    - assets/icons/app_icon.png

    # Wedding Invitation Assets
    - assets/invitations/
    - assets/invitations/lotus_royale/
    - assets/invitations/lotus_royale/backgrounds/
    - assets/invitations/lotus_royale/flowers/
    - assets/invitations/lotus_royale/frames/
    - assets/invitations/lotus_royale/icons/
    - assets/invitations/lotus_royale/preview/


# ============================================================
# APP LAUNCHER ICON CONFIGURATION
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Source icon
  image_path: "assets/icons/app_icon.png"

  # Android
  min_sdk_android: 21

  # iOS
  remove_alpha_ios: true